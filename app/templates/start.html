{% extends "base.html" %}
{% block content %}
<div class="card narrative">
  <h1>PCA test</h1>
  <p>Правила:</p>
  <ul>
    <li>На всё про всё — <b>{{ 60 }} минут</b>. Таймер общий, не на вопрос.</li>
    <li>За правильный ответ — баллы, плюс <b>+50% скоростной бонус</b>, если уложился в 30 cek.</li>
    <li>Можно перепройти — лидерборд сохраняет твой <b>лучший</b> результат.</li>
  </ul>
  <form action="/start" method="post" class="start-form">
    <label>Напишите свое имя?
      <input name="name" required maxlength="48" autocomplete="off" placeholder="Например: Айдана Багланова">
    </label>
    <button type="submit">Начать →</button>
  </form>
</div>
{% endblock %}
